[project]
name = "catsdogs-cnn"
version = "0.1.0"
description = "Microsoft Cats vs Dogs - CNN binary classification (reproducible, test-set isolated)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kagglehub>=0.3.6",
    "numpy>=1.24",
    "pillow>=10.0",
    "matplotlib>=3.7",
    "torch>=2.1",
    "torchvision>=0.16",
]

[tool.uv]
package = false   # proyek berupa script, bukan library yang di-install

# --- Opsional: PyTorch CPU-only (jauh lebih kecil daripada build CUDA bawaan PyPI di Linux) ---
# Hapus tanda '#' pada blok berikut jika tidak memakai GPU, lalu jalankan `uv sync` ulang.
# [[tool.uv.index]]
# name = "pytorch-cpu"
# url = "https://download.pytorch.org/whl/cpu"
# explicit = true
#
